<svg viewBox="0 0 240 60" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Define styles -->
  <defs>
    <style>
      .octarine-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif; font-size: 28px; font-weight: 600; fill: #000; }
    </style>
  </defs>
  
  <!-- Logo Icon (Sparkle/Star) -->
  <g transform="translate(12, 15)">
    <!-- Top point -->
    <line x1="12" y1="0" x2="12" y2="6" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Bottom point -->
    <line x1="12" y1="24" x2="12" y2="30" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Left point -->
    <line x1="0" y1="12" x2="6" y2="12" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Right point -->
    <line x1="24" y1="12" x2="30" y2="12" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Top-right diagonal -->
    <line x1="21.2" y1="2.8" x2="26" y2="7.6" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Bottom-left diagonal -->
    <line x1="2.8" y1="21.2" x2="7.6" y2="26" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Top-left diagonal -->
    <line x1="2.8" y1="2.8" x2="7.6" y2="7.6" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Bottom-right diagonal -->
    <line x1="21.2" y1="21.2" x2="26" y2="26" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Center circle -->
    <circle cx="12" cy="12" r="3" fill="#000"/>
  </g>
  
  <!-- Brand Name -->
  <text x="50" y="38" class="octarine-text">Octarine</text>
</svg>
